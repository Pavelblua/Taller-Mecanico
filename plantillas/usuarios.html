<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }
        .form-control, .form-select {
            border-radius: 10px;
        }
        .btn-primary {
            border-radius: 10px;
            padding: 10px 22px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card p-4 p-md-5">
                    <div class="mb-4">
                        <h2 class="mb-1">Registro de Usuario</h2>
                        <p class="text-muted mb-0">Formulario para la tabla tb_usuarios.</p>
                    </div>

                    <form id="frmUsuario" method="POST" action="#">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="id_tipo_doc" class="form-label">Tipo de documento</label>
                                <select class="form-select" id="id_tipo_doc" name="id_tipo_doc" required>
                                    <option value="">Seleccione</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label for="nro_doc" class="form-label">Nro. documento</label>
                                <input type="text" class="form-control" id="nro_doc" name="nro_doc" maxlength="20" required>
                            </div>

                            <div class="col-md-3">
                                <label for="nombres" class="form-label">Nombres</label>
                                <input type="text" class="form-control" id="nombres" name="nombres" maxlength="100" required>
                            </div>

                            <div class="col-md-3">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" maxlength="100" required>
                            </div>

                            <div class="col-md-4">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" class="form-control" id="correo" name="correo" maxlength="100" required>
                            </div>

                            <div class="col-md-4">
                                <label for="celular" class="form-label">Celular</label>
                                <input type="text" class="form-control" id="celular" name="celular" maxlength="20" required>
                            </div>

                            <div class="col-md-4">
                                <label for="id_estado" class="form-label">Estado</label>
                                <select class="form-select" id="id_estado" name="id_estado" required>
                                    <option value="">Seleccione</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" maxlength="200" required>
                            </div>

                            <div class="col-md-6">
                                <label for="referencia" class="form-label">Referencia</label>
                                <input type="text" class="form-control" id="referencia" name="referencia" maxlength="200">
                            </div>

                            <div class="col-md-4">
                                <label for="id_dep" class="form-label">Departamento</label>
                                <select class="form-select" id="id_dep" name="id_dep" required>
                                    <option value="">Seleccione departamento</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="id_prov" class="form-label">Provincia</label>
                                <select class="form-select" id="id_prov" name="id_prov" required>
                                    <option value="">Seleccione provincia</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="id_dist" class="form-label">Distrito</label>
                                <select class="form-select" id="id_dist" name="id_dist" required>
                                    <option value="">Seleccione distrito</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                            <button type="submit" class="btn btn-primary">Guardar usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tipoDocumento = [
            { id: 1, nombre: 'DNI' },
            { id: 2, nombre: 'CE' },
            { id: 3, nombre: 'RUC' },
            { id: 4, nombre: 'PASAPORTE' }
        ];

        const estados = [
            { id: 1, nombre: 'ACTIVO' },
            { id: 2, nombre: 'INACTIVO' },
            { id: 3, nombre: 'PENDIENTE' }
        ];

        const ubigeo = {
            1: {
                nombre: 'LIMA',
                provincias: {
                    11: {
                        nombre: 'LIMA',
                        distritos: {
                            1101: 'LIMA',
                            1102: 'SAN ISIDRO',
                            1103: 'MIRAFLORES',
                            1104: 'SURCO'
                        }
                    },
                    12: {
                        nombre: 'CALLAO',
                        distritos: {
                            1201: 'CALLAO',
                            1202: 'VILLA EL SALVADOR',
                            1203: 'VENTANILLA'
                        }
                    }
                }
            },
            2: {
                nombre: 'AREQUIPA',
                provincias: {
                    21: {
                        nombre: 'AREQUIPA',
                        distritos: {
                            2101: 'AREQUIPA',
                            2102: 'YANAHUARA',
                            2103: 'CERRO COLORADO'
                        }
                    }
                }
            },
            3: {
                nombre: 'CUSCO',
                provincias: {
                    31: {
                        nombre: 'CUSCO',
                        distritos: {
                            3101: 'CUSCO',
                            3102: 'SAN SERGIO',
                            3103: 'WANCHAQ'
                        }
                    }
                }
            }
        };

        function cargarSelect(selectId, data, valorDefault, textoDefault) {
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">' + textoDefault + '</option>';

            data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.nombre;
                select.appendChild(option);
            });

            if (valorDefault !== undefined) {
                select.value = valorDefault;
            }
        }

        function cargarUbigeo() {
            const depSelect = document.getElementById('id_dep');
            const provSelect = document.getElementById('id_prov');
            const distSelect = document.getElementById('id_dist');

            depSelect.innerHTML = '<option value="">Seleccione departamento</option>';
            Object.entries(ubigeo).forEach(([idDep, dep]) => {
                const option = document.createElement('option');
                option.value = idDep;
                option.textContent = dep.nombre;
                depSelect.appendChild(option);
            });

            depSelect.addEventListener('change', function () {
                const idDep = this.value;
                provSelect.innerHTML = '<option value="">Seleccione provincia</option>';
                distSelect.innerHTML = '<option value="">Seleccione distrito</option>';

                if (!idDep || !ubigeo[idDep]?.provincias) return;

                Object.entries(ubigeo[idDep].provincias).forEach(([idProv, prov]) => {
                    const option = document.createElement('option');
                    option.value = idProv;
                    option.textContent = prov.nombre;
                    provSelect.appendChild(option);
                });
            });

            provSelect.addEventListener('change', function () {
                const idDep = depSelect.value;
                const idProv = this.value;
                distSelect.innerHTML = '<option value="">Seleccione distrito</option>';

                if (!idDep || !idProv || !ubigeo[idDep]?.provincias[idProv]?.distritos) return;

                Object.entries(ubigeo[idDep].provincias[idProv].distritos).forEach(([idDist, distrito]) => {
                    const option = document.createElement('option');
                    option.value = idDist;
                    option.textContent = distrito;
                    distSelect.appendChild(option);
                });
            });
        }

        cargarSelect('id_tipo_doc', tipoDocumento, undefined, 'Seleccione documento');
        cargarSelect('id_estado', estados, undefined, 'Seleccione estado');
        cargarUbigeo();

        document.getElementById('frmUsuario').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const values = Object.fromEntries(formData.entries());

            console.log('Datos del formulario:', values);
            alert('Formulario listo para enviar. Revisa los valores en la consola o conecta este formulario con tu endpoint PHP.');
        });
    </script>
</body>
</html>
